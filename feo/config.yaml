keymap:
  cancel: [escape]
  confirm: [return]
  delete: [d]
  down: [j, down]
  move: [m]
  new: [n]
  scrollDown: ["]"]
  scrollUp: "["
  up: [k, up]
  write: [w]
theme:
  inactive: orange
  active: cyan
  success: green
  info: blue
  warning: yellow
  error: red
applications:
  feo:
    targets:
      config:
        path: "~/.config/feo/config.jsonc"
        sources:
          - path: "~/.config/feo/feo/config.jsonc"
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/feo/config.jsonc"
  hunk:
    targets:
      config:
        path: "~/.config/hunk/config.toml"
        sources:
          - path: "~/.config/feo/hunk/config.toml"
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/hunk/config.toml"
  mise:
    targets:
      config:
        path: "~/.config/mise/config.toml"
        sources:
          - path: "~/.config/feo/mise/config.toml"
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/mise/config.toml"
  opencode:
    template:
      vars:
        expertise: TypeScript
    targets:
      config:
        path: "~/.config/opencode/opencode.jsonc"
        sources:
          - path: "~/.config/feo/opencode/opencode.jsonc"
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/opencode/opencode.jsonc"
      agent-plan:
        path: "~/.config/opencode/agents/plan.md"
        sources:
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/opencode/agents/plan.md"
      agent-build:
        path: "~/.config/opencode/agents/build.md"
        sources:
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/opencode/agents/build.md"
      agent-review:
        path: "~/.config/opencode/agents/reviewer.md"
        sources:
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/opencode/agents/reviewer.md"
            template:
              language: liquid
      agent-debugger:
        path: "~/.config/opencode/agents/debugger.md"
        sources:
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/opencode/agents/debugger.md"
      agent-documenter:
        path: "~/.config/opencode/agents/documenter.md"
        sources:
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/opencode/agents/documenter.md"
      agent-teacher:
        path: "~/.config/opencode/agents/teacher.md"
        sources:
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/opencode/agents/teacher.md"
      command-debug:
        path: "~/.config/opencode/commands/debug.md"
        sources:
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/opencode/commands/debug.md"
      command-grill:
        path: "~/.config/opencode/commands/grill.md"
        sources:
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/opencode/commands/grill.md"
      command-handoff:
        path: "~/.config/opencode/commands/handoff.md"
        sources:
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/opencode/commands/handoff.md"
      command-review:
        path: "~/.config/opencode/commands/review.md"
        sources:
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/opencode/commands/review.md"
  zed:
    targets:
      settings:
        path: "~/.config/zed/settings.json"
        sources:
          - path: "~/.config/feo/zed/settings.jsonc"
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/zed/settings.jsonc"
      theme-catppuccin-sky:
        path: "~/.config/zed/themes/catppuccin-sky.json"
        sources:
          - url: "https://raw.githubusercontent.com/ferrousaurus/dotfiles/refs/heads/main/zed/themes/catppuccin-sky.json"
