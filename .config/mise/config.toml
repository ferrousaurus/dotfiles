[settings]
color_theme = "catppuccin"
experimental = true
idiomatic_version_file_enable_tools = ["node", "npm", "pnpm", "python"]
lockfile = true
minimum_release_age = "3d"
pin = true

[settings.npm]
package_manager = "aube"

[bootstrap.macos.dock]
autohide = true
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "column"

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"com.app.finder" = { AppleShowAllFiles = true }

[dotfiles]
"~/.zshrc" = {}

[env]
TERM = "xterm-256color"

[shell_alias]
brew86 = "arch -x86_64 /usr/local/bin/brew"
cat = "bat --color=always"
cd = "z"
fzf = "fzf --preview 'bat --color=always --style=numbers --line-range=:500 {}'"
grep = "batgrep"
ls = "eza -aghl --show-symlinks --icons=always --hyperlink"
pnpm = "aube"
vi = "nvim"
vim = "nvim"

[tools]
age = "latest"
ast-grep = "latest"
aube = "latest"
bat = "latest" # cat replcaement
bat-extras = "latest"
bottom = "latest" # Process TUI
bun = "1.3"
deno = "2.9"
docker-cli = "latest"
docker-compose = "latest"
dotnet = "10"
eza = "latest" # ls replacement
fd = "latest" # find replacement
fzf = "latest"
go = "1.24"
java = "26"
lazygit = "latest"
neovim = "latest"
node = "26"
nub = "latest"
opencode = "latest"
oxker = "latest" # Containerization TUI
python = "3.14"
ripgrep = "latest" # grep replacement
starship = "latest"
sops = "latest"
tree-sitter = "latest"
usage = "latest"
uv = "0.12" # Python dependency manager
viteplus = "latest"
watchexec = "latest"
zoxide = "latest" # cd replacement

"dotnet:Aspire.Cli" = "13"

"github:agavra/tuicr" = "latest"

"npm:skills" = "latest"

"pipx:mlx-lm" = "latest"
