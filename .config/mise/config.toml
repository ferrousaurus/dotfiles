[settings]
color_theme = "catppuccin"
experimental = true
lockfile = false
minimum_release_age = "3d"
pin = true
prefer_offline = true

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[settings.npm]
package_manager = "aube"

[env]
_.file = { path = "~/.config/mise/.secrets.toml", redact = true }

OPENCODE_EXPERIMENTAL_OXFMT = true
OPENCODE_EXPERIMENTAL_DISABLE_COPY_ON_SELECT = true
OPENCODE_EXPERIMENTAL_SCOUT = true

[bootstrap.repos]
#"~/.dotfiles" = { url = "git@github.com:ferrousaurus/dotfiles.git", ref = "main" }

[dotfiles]
"~/.config/git" = {}
"~/.config/mise" = {}
"~/.config/nvim" = {}
"~/.config/opencode" = {}
"~/.config/oxlint" = {}

"~/.config/starship.toml" = {}

[tools]
age = { version = "1.3" }
aspire = { version = "13.6" }
atuin = { version = "18.24" }
aube = { version = "2.10" }
bottom = { version = "0.15" } # Process TUI
bun = { version = "1.4" }
docker-cli = { version = "29.9" }
dotnet = { version = "10" }
fzf = { version = "0.75" }
github-cli = { version = "2.103" }
lazygit = { version = "0.66" }
neovim = { version = "0.12" }
node = { version = "26" }
nub = { version = "0.10" }
ripgrep = { version = "0.10" } # grep replacement
rust = { version = "1" }
sops = { version = "3.13" }
starship = { version = "1.27" }
usage = { version = "7.3" }
yq = { version = "4.54" }
zoxide = { version = "0.10" } # cd replacement

docker-compose = { depends = ["docker-cli"], version = "5.7" }
lazydocker = { depends = ["docker-cli"], version = "0.25" }

opencode = { depends = ["nub"], version = "2.2", postinstall = "cd $HOME/.config/opencode && nub ci" }
oxlint = { depends = ["nub"], version = "1.93", postinstall = "cd $HOME/.config/oxlint && nub ci" }

"github:getnf/getnf" = { version = "0.4.0", postinstall = "getnf -i FiraCode" }

"dotnet:csharp-ls" = { version = "0.28" }

"npm:skills" = { version = "1.7.2", postinstall = "skills experimental_install -g" }
