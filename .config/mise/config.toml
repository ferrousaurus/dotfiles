[settings]
color_theme = "catppuccin"
experimental = true
lockfile = false
minimum_release_age = "3d"
pin = true

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[settings.npm]
package_manager = "aube"

[env]
_.file = { path = "~/.config/mise/.secrets.toml", redact = true }

#OPENCODE_AGENTS_BUILD_MODEL=
#OPENCODE_AGENTS_PLAN_MODEL=
#OPENCODE_AGENTS_EXPLORE_MODEL=
#OPENCODE_AGENTS_GENERAL_MODEL=
#OPENCODE_AGENTS_DEBUGGER_MODEL=
#OPENCODE_AGENTS_REVIEWER_MODEL=
#OPENCODE_AGENTS_RESEARCHER_MODEL=
#OPENCODE_AGENTS_IMPLEMENTER_MODEL=
#OPENCODE_AGENTS_DOCUMENTER_MODEL=
#OPENCODE_AGENTS_COMPACTION_MODEL=
#OPENCODE_AGENTS_SUMMARY_MODEL=
#OPENCODE_AGENTS_TITLE_MODEL=

OPENCODE_EXPERIMENTAL_OXFMT = true
OPENCODE_EXPERIMENTAL_DISABLE_COPY_ON_SELECT = true
OPENCODE_EXPERIMENTAL_SCOUT = true

OPENCODE_PERMISSIONS_SKILL_CLOUDFLARE_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_BASIN_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_K2_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_NEXTJS_ON_CLOUDFLARE_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_AGENTS_SDK_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_DURABLE_OBJECTS_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_SANDBOX_NEXT_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_SANDBOX_STABLE_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_SANDBOX_MIGRATE_TO_NEXT_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_CF_CLI_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_WRANGLER_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_WORKERS_PROFILING_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_CLOUDFLARE_EMAIL_SERVICE_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_TURNSTILE_SPIN_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_WEB_PERF_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_CLOUDFLARE_ONE_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_CLOUDFLARE_ONE_MIGRATIONS_EFFECT = "deny"
OPENCODE_PERMISSIONS_SKILL_GATEWAY_WORKERS_EFFECT = "deny"

[bootstrap.repos]
#"~/.dotfiles" = { url = "git@github.com:ferrousaurus/dotfiles.git", ref = "main" }
"~/source/ferrousaurus/system-one-mcp" = { url = "git@github.com:ferrousaurus/system-one-mcp.git", ref = "main" }

[dotfiles]
"~/.agents/.skill-lock.json" = {}
"~/.agents/skills" = {}
"~/.config/atuin" = {}
"~/.config/git" = {}
"~/.config/mise" = {}
"~/.config/nvim" = {}
"~/.config/opencode" = {}
"~/.config/oxlint" = {}
"~/.config/starship.toml" = {}

[tools]
bun = { version = "1.4" }
dotnet = { version = "10" }
node = { version = "26" }
rust = { version = "1" }

"aqua:aubepkg/aube" = { version = "latest" }
"aqua:cli/cli" = { version = "latest" } # GitHub CLI
"aqua:docker/cli" = { version = "latest" }
"aqua:herdrdev/herdr" = { version = "latest" } # harness-friendly multiplexer
"aqua:getsops/sops" = { version = "latest" }
"aqua:jesseduffield/lazydocker" = { depends = ["aqua:docker/cli"], version = "latest" }
"aqua:jesseduffield/lazygit" = { version = "latest" }
"aqua:junegunn/fzf" = { version = "latest" }
"aqua:mikefarah/yq" = { version = "latest" } # jq replacement
"aqua:neovim/neovim" = { version = "latest" }
"aqua:oxc-project/oxc/oxlint" = { depends = ["github:nubjs/nub"], version = "latest", postinstall = "cd $HOME/.config/oxlint && nub i" }

"asdf:threkk/asdf-age" = { version = "latest" }

"cargo:ast-grep" = { version = "latest" }
"cargo:atuin" = { version = "latest" }
"cargo:bat" = { version = "latest" }
"cargo:bottom" = { version = "latest" } # Process TUI
"cargo:eza" = { version = "latest" } # ls replacement
"cargo:fd-find" = { version = "latest" } # find replacement
"cargo:oxker" = {version = "latest" } # Containerization TUI
"cargo:ripgrep" = {version = "latest" } # grep replacement
"cargo:starship" = { version = "latest" }
"cargo:usage-cli" = { version = "latest" }
"cargo:zoxide" = { version = "latest" } # cd replacement

"github:docker/compose" = { depends = ["aqua:docker/cli"], version = "latest" }
"github:nubjs/nub" = { allow_builds = ["@nubjs/nub"], version = "latest" }

"dotnet:Aspire.Cli" = { version = "13" }
"dotnet:csharp-ls" = { version = "latest" }

"npm:@opencode/cli" = { depends = ["github:nubjs/nub"], version = "latest", allow_builds = ["@opencode/cli"], postinstall = "cd $HOME/.config/opencode && nub i" }

"npm:skills" = { version = "1.7.4", postinstall = "skills experimental_install -g" }

[tasks.bootstrap]
run = '''
cd ~/source/ferrousaurus/system-one-mcp && nub i
'''

[tasks."global:skills:install:global"]
description = "Restore skills when skills-lock.json exists"
tools = { node = "26", "npm:skills" = "1.7.4" }
run = 'skills experimental_install -g'
sources = ["~/.agents/.skill-lock.json"]
outputs = ["~/.agents/skills"]
interactive = true
raw = true
quiet = true

[tasks."global:skills:install:project"]
description = "Restore skills when skills-lock.json exists"
dir = "{{ cwd }}"
tools = { node = "26", "npm:skills" = "1.7.4" }
run = 'skills experimental_install'
sources = ["skills-lock.json"]
outputs = [".agents/skills"]
interactive = true
raw = true
quiet = true
