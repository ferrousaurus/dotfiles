[settings]
color_theme = "catppuccin"
experimental = true
lockfile = true
minimum_release_age = "3d"
pin = true

[settings.npm]
package_manager = "aube"

[env]
_.file = { path = "~/.config/mise/.secrets.toml", redact = true }
OPENCODE_EXPERIMENTAL_OXFMT = true
OPENCODE_EXPERIMENTAL_DISABLE_COPY_ON_SELECT = true
OPENCODE_EXPERIMENTAL_SCOUT = true
TERM = "xterm-256color"

[bootstrap.repos]
#"~/.dotfiles" = { url = "git@github.com:ferrousaurus/dotfiles.git", ref = "main" }

[bootstrap.hooks.pre-dotfiles]
run = [
  '''#!/usr/bin/env zsh
# Merge OpenCode configs
[ -f ~/.dotfiles/.config/opencode/opencode.local.json ] || echo "{}" > ~/.dotfiles/.config/opencode/opencode.local.json
jq -s '.[0] * .[1]' ~/.dotfiles/.config/opencode/opencode.git.json ~/.dotfiles/.config/opencode/opencode.local.json > ~/.dotfiles/.config/opencode/opencode.json
''',
  '''#!/usr/bin/env zsh
# Merge OpenCode v2 configs
[ -f ~/.dotfiles/.config/opencode/opencode2.local.json ] || echo "{}" > ~/.dotfiles/.config/opencode/opencode2.local.json
jq -s '.[0] * .[1]' ~/.dotfiles/.config/opencode/opencode2.git.json ~/.dotfiles/.config/opencode/opencode2.local.json > ~/.dotfiles/.config/opencode/opencode2.json
''',
  '''#!/usr/bin/env zsh
# Merge Zed configs
[ -f ~/.dotfiles/.config/zed/settings.local.json ] || echo "{}" > ~/.dotfiles/.config/zed/settings.local.json
jq -s '.[0] * .[1]' ~/.dotfiles/.config/zed/settings.git.json ~/.dotfiles/.config/zed/settings.local.json > ~/.dotfiles/.config/zed/settings.json
''',
]

[dotfiles]
"~/.agents/.skill-lock.json" = {}
"~/.agents/agents" = {}
"~/.agents/skills" = {}

"~/.config/atuin/config.toml" = {}
"~/.config/ghostty/config.ghostty" = {}
"~/.config/git/ignore" = {}
"~/.config/herdr/config.toml" = {}
"~/.config/kitty/kitty.conf" = {}
"~/.config/kitty/catppuccin-macchiato.conf" = {}
"~/.config/mise/miserc.toml" = {}
"~/.config/mise/config.toml" = {}
"~/.config/mise/config.macos.toml" = {}
"~/.config/mise/config.linux.toml" = {}
"~/.config/opencode/AGENTS.md" = {}
"~/.config/opencode/cli.json" = {}
"~/.config/opencode/commands" = {}
"~/.config/opencode/prompts" = {}
"~/.config/opencode/opencode.json" = {}
"~/.config/opencode/opencode-quota/quota-toast.jsonc" = {}
"~/.config/opencode/tui.jsonc" = {}
"~/.config/oxlint" = {}
"~/.config/starship.toml" = {}
"~/.config/zed/keymap.jsonc" = {}
"~/.config/zed/settings.json" = {}
"~/.config/zed/tasks.json" = {}
"~/.config/nvim" = {}
"~/.config/zed/themes/catppuccin-sky.json" = {}

"~/.zshrc" = {}

[tools]
age = "latest"
ast-grep = "latest"
atuin = "latest"
aube = "latest"
bat = "latest" # cat replcaement
bat-extras = "latest"
bottom = "latest" # Process TUI
colima = "latest" # Docker-compatible Container VM
docker-cli = "latest"
docker-compose = "latest"
dotnet = "10"
eza = "latest" # ls replacement
fd = "latest" # find replacement
fzf = "latest"
github-cli = "latest"
herdr = "latest" # harness-friendly multiplexer
lazygit = "latest"
neovim = "latest"
node = "26"
nub = { version = "latest", allow_builds = ["@nubjs/nub"] }
opencode = "latest"
oxker = "latest" # Containerization TUI
oxlint = "latest"
ripgrep = "latest" # grep replacement
starship = "latest"
sops = "latest"
usage = "latest"
zoxide = "latest" # cd replacement
yq = "latest" # jq replacement

"npm:skills" = "latest"

[bootstrap.hooks.final]
run = [
  '''#!/usr/bin/env zsh
# Configure Docker CLI plugins
f="$HOME/.docker/config.json"
mkdir -p "$HOME/.docker"
test -f "$f" || echo '{}' > "$f"
platform="$(uname)"
mise_compose="$(mise which docker-compose 2>/dev/null || true)"
mise_compose_dir=""
if [ -n "$mise_compose" ] && [ -x "$mise_compose" ]; then
  mise_compose_dir="$(dirname "$mise_compose")"
fi
jq -M --arg home "$HOME" --arg platform "$platform" --arg mise_compose_dir "$mise_compose_dir" '(.cliPluginsExtraDirs // []) as $existing | .cliPluginsExtraDirs = ($existing + ([ (if $platform == "Darwin" then "/opt/homebrew/lib/docker/cli-plugins" else empty end), ($home + "/.docker/cli-plugins"), (if $mise_compose_dir != "" then $mise_compose_dir else empty end) ] - $existing)) | if $platform == "Darwin" then .credsStore = (.credsStore // "osxkeychain") | .currentContext = (.currentContext // "colima") else . end' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
''',
  '''#!/usr/bin/env zsh
# Install opencode packages
cd $HOME/.config/opencode
mise exec -- nub i
''',
  '''#!/usr/bin/env zsh
# Install oxlint packages
cd $HOME/.config/oxlint
mise exec -- nub i
''',
]

[shell_alias]
cat = "bat --color=always"
cd = "z"
fzf = "fzf --preview 'bat --color=always --style=numbers --line-range=:500 {}'"
grep = "batgrep"
ls = "eza -aghl --show-symlinks --icons=always --hyperlink"
vi = "nvim"
vim = "nvim"
oxlint = "nubx -y oxlint"
