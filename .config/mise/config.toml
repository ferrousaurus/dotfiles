[settings]
color_theme = "catppuccin"
experimental = true
lockfile = true
minimum_release_age = "3d"
pin = true

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[settings.npm]
package_manager = "aube"

[env]
_.file = { path = "~/.config/mise/.secrets.toml", redact = true }
OPENCODE_EXPERIMENTAL_OXFMT = true
OPENCODE_EXPERIMENTAL_DISABLE_COPY_ON_SELECT = true
OPENCODE_EXPERIMENTAL_SCOUT = true

[bootstrap.repos]
#"~/.dotfiles" = { url = "git@github.com:ferrousaurus/dotfiles.git", ref = "main" }

[dotfiles]
"~/.agents/.skill-lock.json" = {}
"~/.agents/skills" = {}
"~/.config/atuin" = {}
"~/.config/git" = {}
"~/.config/mise" = {}
"~/.config/nvim" = {}
"~/.config/opencode" = {}
"~/.config/oxlint" = {}
"~/.config/starship.toml" = {}

[tools]
age = "latest"
ast-grep = "latest"
atuin = "latest"
aube = "latest"
bat = "latest"
bottom = "latest" # Process TUI
docker-cli = "latest"
docker-compose = "latest"
dotnet = "10"
eza = "latest" # ls replacement
fd = "latest" # find replacement
fzf = "latest"
github-cli = "latest"
lazygit = "latest"
herdr = "latest" # harness-friendly multiplexer
neovim = "latest"
node = "26"
nub = { version = "latest", allow_builds = ["@nubjs/nub"] }
"opencode" = { version = "latest", postinstall = "cd $HOME/.config/opencode && mise exec -- nub i" }
oxker = "latest" # Containerization TUI
oxlint = { version = "latest", postinstall = "cd $HOME/.config/oxlint && mise exec -- nub i" }
ripgrep = "latest" # grep replacement
sops = "latest"
starship = "latest"
usage = "latest"
yq = "latest" # jq replacement
zoxide = "latest" # cd replacement

"dotnet:Aspire.Cli" = "13"
"dotnet:csharp-ls" = "latest"

"npm:skills" = "latest"

