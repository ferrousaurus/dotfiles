
[bootstrap.hooks.pre-packages]
run = "test -d /usr/libexec/rosetta || softwareupdate --install-rosetta --agree-to-license"

[bootstrap.hooks.final]
run = '''
f="$HOME/.docker/config.json"
mkdir -p "$HOME/.docker"
test -f "$f" || echo '{}' > "$f"
jq -M '(.cliPluginsExtraDirs // []) as $existing | .credsStore = (.credsStore // "osxkeychain") | .currentContext = (.currentContext // "colima") | .cliPluginsExtraDirs = ($existing + (["/opt/homebrew/lib/docker/cli-plugins", (env.HOME + "/.docker/cli-plugins"), (env.HOME + "/.local/share/mise/installs/docker-compose/latest")] - $existing))' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
'''

[bootstrap.hooks.post-defaults]
run = "killall Dock || true"

[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
show_recents = false
tilesize = 36
magnification = false

[bootstrap.macos.finder]
show_all_files = true
#show_extensions_warning = false
show_pathbar = true
show_status_bar = true
preferred_view_style = "column"

[bootstrap.macos.keyboard]
#key_repeat = 2
#initial_key_repeat = 15
#press_and_hold = true
fn_state = false

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[bootstrap.macos.defaults]
"com.app.finder" = { AppleShowAllFiles = true }

[bootstrap.packages]
"brew:docker-credential-helper" = "latest"
"brew:git" = "latest"
"brew:mise" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-history-substring-search" = "latest"
"brew:zsh-syntax-highlighting" = "latest"

# These are commented out because they are expected to be installed, but may not
# function with a mirror. Add them to the config.local.toml, or install them
# manually with `brew install ${PACKAGE}`
# "brew:docker-buildx" = "latest"
# "brew:lima" = "latest"
# "brew:luarocks" = "latest"

[bootstrap.repos]
#"~/.dotfiles" = { url = "git@github.com:ferrousaurus/dotfiles.git", ref = "main" }

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/.agents/.skill-lock.json" = {}

"~/.config/ghostty/config.ghostty" = {}
"~/.config/git/ignore" = {}
"~/.config/herdr/config.toml" = {}
"~/.config/hunk/config.toml" = {}
"~/.config/kitty/kitty.conf" = {}
"~/.config/kitty/catppuccin-macchiato.conf" = {}
"~/.config/mise/config.toml" = {}
"~/.config/opencode/commands" = {}
"~/.config/opencode/AGENTS.md" = {}
"~/.config/opencode/opencode.json" = { source = "~/.dotfiles/.config/opencode/opencode.json.tmpl", mode = "template" }
"~/.config/starship.toml" = {}
"~/.config/zed/keymap.jsonc" = {}
"~/.config/zed/settings.json" = { source = "~/.dotfiles/.config/zed/settings.json.tmpl", mode = "template" }
"~/.config/zed/tasks.json" = {}
"~/.config/nvim" = {}
"~/.config/zed/themes/catppuccin-sky.json" = {}

"~/.zshrc" = {}

[env]
_.file = "~/.config/mise/.secrets.toml"
OPENCODE_EXPERIMENTAL_OXFMT = true
OPENCODE_EXPERIMENTAL_DISABLE_COPY_ON_SELECT = true
OPENCODE_EXPERIMENTAL_SCOUT = true
TERM = "xterm-256color"

[settings]
color_theme = "catppuccin"
experimental = true
idiomatic_version_file_enable_tools = ["node", "npm", "pnpm", "python"]
lockfile = true
minimum_release_age = "3d"
pin = true

[settings.npm]
package_manager = "aube"

[shell_alias]
brew86 = "arch -x86_64 /usr/local/bin/brew"
cat = "bat --color=always"
cd = "z"
fzf = "fzf --preview 'bat --color=always --style=numbers --line-range=:500 {}'"
grep = "batgrep"
ls = "eza -aghl --show-symlinks --icons=always --hyperlink"
vi = "nvim"
vim = "nvim"

[tools]
age = "latest"
ast-grep = "latest"
bat = "latest" # cat replcaement
bat-extras = "latest"
bottom = "latest" # Process TUI
colima = "latest" # Docker-compatible Container VM
docker-cli = "latest"
docker-compose = "latest"
eza = "latest" # ls replacement
fd = "latest" # find replacement
fzf = "latest"
lazygit = "latest"
neovim = "latest"
opencode = "latest"
oxker = "latest" # Containerization TUI
ripgrep = "latest" # grep replacement
starship = "latest"
sops = "latest"
usage = "latest"
zoxide = "latest" # cd replacement
yq = "latest" # jq replacement

"npm:skills" = "latest"
