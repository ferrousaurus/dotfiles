# Pi-native Catppuccin Powerline adaptation of ~/.config/starship.toml.
format = "[](red)$provider$model$thinking[](bg:peach fg:red)$directory[](bg:yellow fg:peach)$git_branch$git_status[](fg:yellow bg:green)$activity[](fg:green bg:sapphire)$context[](fg:sapphire bg:lavender)$extension_status[](fg:navy)"
palette = "catppuccin_macchiato"

[provider]
format = "[ $provider ]($style)"
symbol = ""
style = "fg:crust bg:red bold"
provider_aliases = { "github-copilot" = "", "openai" = "", "openai-codex" = "", "claude" = "", "anthropic" = "" }

[model]
format = "[$model ]($style)"
symbol = ""
style = "fg:crust bg:red bold"

[directory]
format = "[ $path ]($style)"
symbol = ""
style = "fg:crust bg:peach bold"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
substitutions = { "Documents" = "󰈙 ", "Downloads" = " ", "Music" = "󰝚 ", "Pictures" = " ", "Developer" = "󰲋 " }

[git_branch]
format = "[ $symbol $branch ]($style)"
symbol = ""
style = "fg:crust bg:yellow bold"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "fg:crust bg:yellow bold"

[thinking]
format = "[ $symbol $level ]($style)"
symbol = "󰔟"
style = "fg:crust bg:red bold"

[activity]
format = "[ $text ]($style)"
symbol = "󰑮"
style = "fg:crust bg:green bold"

[context]
format = "[ $symbol $percentage ](fg:crust bg:sapphire bold)"
symbol = "󰍛"

[[context.display]]
threshold = 0
style = "sapphire"
hidden = false

[time]
format = "[  $time ]($style)"
symbol = ""
style = "fg:crust bg:lavender bold"

[extension_status]
format = "[$statuses ]($style)"
style = "fg:crust bg:lavender bold"
separator = ""
icons = { "loadout" = "󰦨", "system-prompt" = "󰧑", "pi-quotas" = "󰄦", "pi-lens-lsp" = "󰒋", "pi-quotas-usage" = "%" }
styles = {"loadout" = "fg:crust bg:lavender", "system-prompt" = "fg:lavender bg:crust", "pi-lens-lsp" = "fg:crust bg:red", "pi-quotas-usage" = "fg:red bg:navy" }

