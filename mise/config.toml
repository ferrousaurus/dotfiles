[env]
TERM = "xterm-256color"

[settings]
color_theme = "catppuccin"
experimental = true
idiomatic_version_file_enable_tools = ["dotnet", "node", "npm", "pnpm", "python"]
lockfile = true
minimum_release_age = "3d"
pin = true

[settings.npm]
package_manager = "pnpm"

[shell_alias]
brew86 = "arch -x86_64 /usr/local/bin/brew"
cat = "bat --color=always"
cd = "z"
fzf = "fzf --preview 'bat --color=always --style=numbers --line-range=:500 {}'"
grep = "batgrep"
ls = "eza -aghl --show-symlinks --icons=always --hyperlink"
vi = "nvim"
vim = "nvim"

[tools]
age = "latest"
ast-grep = "latest"
bat = "latest" # cat replcaement
bat-extras = "latest"
bottom = "latest" # Process TUI
colima = "latest" # MacOS Docker Desktop replacement
docker-cli = "latest"
docker-compose = "latest"
dotnet = ["10", "8"]
eza = "latest" # ls replacement
fd = "latest" # find replacement
fzf = "latest"
github-cli = "latest"
lazygit = "latest"
"vfox:mise-plugins/vfox-neovim" = "latest"
node = ["26", "24"]
opencode = "latest"
oxker = "latest" # Containerization TUI
pnpm = "latest"
python = ["3.14", "3.12"]
ripgrep = "latest" # grep replacement
starship = "latest"
sops = "latest"
tree-sitter = "latest"
usage = "latest"
uv = "latest" # Python dependency manager
viteplus = "latest"
watchexec = "latest"
zellij = "latest" # tmux replacement
zoxide = "latest" # cd replacement

"dotnet:Aspire.Cli" = "13"

"npm:node-gyp" = "latest"
"npm:ocx" = "latest"
"npm:skills" = "latest"
